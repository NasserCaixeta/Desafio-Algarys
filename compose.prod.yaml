name: clinic-confirmations

x-production-environment: &production-environment
  APP_ENV: production
  LOG_JSON: "true"
  CORS_ORIGINS: https://${DOMAIN:-example.com}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clinic_confirmations}

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: always

  redis:
    ports: !reset []
    restart: always

  migrate:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/clinic-confirmations-api:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment: *production-environment

  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/clinic-confirmations-api:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment: *production-environment
    ports: !reset []
    restart: always

  worker:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/clinic-confirmations-worker:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment: *production-environment
    restart: always

  scheduler:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/clinic-confirmations-worker:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment: *production-environment
    restart: always

  frontend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/clinic-confirmations-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    ports: !reset []
    restart: always

  nginx:
    image: nginx:1.28-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - backend
      - edge

  certbot:
    image: certbot/certbot:v5.7.0
    profiles: ["tls"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: ["renew", "--webroot", "--webroot-path=/var/www/certbot"]
    networks:
      - edge

volumes:
  letsencrypt:
  certbot_www:

networks:
  edge:
    driver: bridge
