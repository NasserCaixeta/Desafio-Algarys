name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinic_confirmations_test
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_confirmations_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic_local_password@localhost:5432/clinic_confirmations_test
      TEST_DATABASE_URL: postgresql+psycopg://clinic:clinic_local_password@localhost:5432/clinic_confirmations_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'

      - name: Lint backend
        run: ruff check backend

      - name: Type-check backend
        run: mypy --config-file backend/pyproject.toml backend/src

      - name: Verify migration upgrade, downgrade and re-upgrade
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade -1
          alembic upgrade head

      - name: Test backend with coverage
        run: >-
          pytest -q backend/tests
          --cov=clinic_confirmations
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend with coverage
        run: npm run test -- --run --coverage

      - name: Build frontend
        run: npm run build

  containers:
    name: Compose build and smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose configurations
        run: |
          bash -n deploy/scripts/bootstrap.sh deploy/scripts/deploy.sh deploy/scripts/ssh-entrypoint.sh
          test -x deploy/scripts/bootstrap.sh
          test -x deploy/scripts/deploy.sh
          test -x deploy/scripts/ssh-entrypoint.sh
          docker compose config --quiet
          if DOMAIN=clinic.example.com GHCR_OWNER=example IMAGE_TAG=ci \
            docker compose -f compose.yaml -f compose.prod.yaml config --quiet 2>/dev/null; then
            echo "Production Compose must reject a missing POSTGRES_PASSWORD"
            exit 1
          fi
          DOMAIN=clinic.example.com GHCR_OWNER=example IMAGE_TAG=ci POSTGRES_PASSWORD=ci-password \
            docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          DOMAIN=clinic.example.com GHCR_OWNER=example IMAGE_TAG=ci POSTGRES_PASSWORD=ci-password \
            docker compose -f deploy/portainer/stack.yaml config --quiet

      - name: Build application images
        run: docker compose build api frontend

      - name: Run containerized smoke test
        run: ./scripts/smoke.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop test environment
        if: always()
        run: docker compose down --volumes --remove-orphans
