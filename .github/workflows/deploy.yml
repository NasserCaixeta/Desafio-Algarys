name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
  IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: API
            image: clinic-confirmations-api
            dockerfile: backend/Dockerfile
          - name: Worker
            image: clinic-confirmations-worker
            dockerfile: backend/Dockerfile
          - name: Frontend
            image: clinic-confirmations-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry owner
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cd-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=cd-${{ matrix.image }}

  verify:
    name: Verify production deployment
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      BASIC_AUTH_USERNAME: ${{ vars.BASIC_AUTH_USERNAME }}
      BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
    steps:
      - name: Wait for pull-based deployment
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          for attempt in {1..48}; do
            if curl --fail --silent --show-error --max-time 10 \
              --user "$BASIC_AUTH_USERNAME:$BASIC_AUTH_PASSWORD" \
              --output "$response_file" \
              "$PRODUCTION_URL/status"; then
              current_version=$(python3 -c \
                'import json,sys; print(json.load(open(sys.argv[1]))["version"])' \
                "$response_file")
              if [[ $current_version == "$IMAGE_TAG" ]]; then
                curl --fail --silent --show-error --max-time 10 \
                  "$PRODUCTION_URL/health/live" >/dev/null
                exit 0
              fi
            fi
            echo "Waiting for $IMAGE_TAG (attempt $attempt/48)"
            sleep 10
          done

          echo "Production did not reach $IMAGE_TAG within the deployment window" >&2
          exit 1

      - name: Record deployment summary
        if: success()
        run: |
          {
            echo '### Production deployment'
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- URL: $PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
