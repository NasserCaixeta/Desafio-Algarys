name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
  IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: API
            image: clinic-confirmations-api
            dockerfile: backend/Dockerfile
          - name: Worker
            image: clinic-confirmations-worker
            dockerfile: backend/Dockerfile
          - name: Frontend
            image: clinic-confirmations-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry owner
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cd-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=cd-${{ matrix.image }}

  release:
    name: Release for production watcher
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Record immutable release
        run: |
          {
            echo '### Immutable production release published'
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- URL: ${{ vars.PRODUCTION_URL }}"
            echo '- The VPS watcher will deploy this release and validate health locally.'
          } >> "$GITHUB_STEP_SUMMARY"
